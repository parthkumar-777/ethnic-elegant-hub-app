{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Login</h2>
  <form method="post">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>
  </form>
  <p style="text-align:center; margin-top:14px; font-size:13px;">New here? <a href="{{ url_for('signup') }}" style="color:var(--maroon); font-weight:600;">Create an account</a></p>
</div>
{% endblock %}
