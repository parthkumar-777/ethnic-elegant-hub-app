{% extends "base.html" %}
{% block content %}
<div class="container section" style="max-width:600px;">
  <h2>Contact Us</h2>
  <div class="cart-summary" style="margin-bottom:20px;">
    <p style="font-size:14px; color:#555;"><b>📧 Email:</b> support@ethnicelegant.com</p>
    <p style="font-size:14px; color:#555;"><b>🕒 Hours:</b> Mon-Sat, 10am - 7pm</p>
  </div>

  <div class="form-card" style="margin:0;">
    <h2>Send us a message</h2>
    <form method="post">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>Your Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Message</button>
    </form>
  </div>
</div>
{% endblock %}
