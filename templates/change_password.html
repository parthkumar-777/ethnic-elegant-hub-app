{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Change Password</h2>
  <form method="post">
    <div class="form-group">
      <label>Current Password</label>
      <div class="password-wrap">
        <input type="password" name="current_password" id="curPw" required>
        <span class="toggle-password" data-target="curPw">👁️</span>
      </div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <div class="password-wrap">
        <input type="password" name="new_password" id="newPw" required minlength="6">
        <span class="toggle-password" data-target="newPw">👁️</span>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="password-wrap">
        <input type="password" name="confirm_password" id="confPw" required minlength="6">
        <span class="toggle-password" data-target="confPw">👁️</span>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update Password</button>
  </form>
  <p style="text-align:center; margin-top:14px; font-size:13px;"><a href="{{ url_for('account') }}" style="color:var(--maroon); font-weight:600;">← Back to Account</a></p>
</div>
{% endblock %}
