{% extends "base.html" %}
{% block content %}
<div class="container section">
  <h2>Checkout</h2>
  <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px;">
    <form method="post">
      <div class="form-group">
        <label>Delivery Address</label>
        <textarea name="address" rows="4" required placeholder="House no, street, city, state, pincode">{{ user['address'] or '' }}</textarea>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select name="payment_method">
          <option value="COD">Cash on Delivery</option>
          <option value="UPI">UPI</option>
          <option value="Card">Credit / Debit Card</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Place Order</button>
    </form>
    <div class="cart-summary">
      <h3 style="color:var(--maroon);">Order Summary</h3>
      {% for it in items %}
      <p style="display:flex; justify-content:space-between; font-size:13px;"><span>{{ it.product['name'] }} × {{ it.qty }}</span><span>₹{{ it.subtotal|int }}</span></p>
      {% endfor %}
      <hr>
      <p style="display:flex; justify-content:space-between; font-weight:700;"><span>Total</span><span>₹{{ total|int }}</span></p>
    </div>
  </div>
</div>
{% endblock %}
