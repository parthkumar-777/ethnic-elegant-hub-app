{% extends "base.html" %}
{% block content %}
<div class="container section" style="text-align:center;">
  <div style="font-size:56px;">✅</div>
  <h2 style="border:none;">Order Placed Successfully!</h2>
  <p style="color:#666;">Your order #{{ order['id'] }} has been placed and will be delivered soon.</p>
  <p style="color:#666;">Total: <b>₹{{ order['total_amount']|int }}</b> · Payment: {{ order['payment_method'] }}</p>
  <div style="margin-top:20px;">
    <a href="{{ url_for('my_orders') }}" class="btn btn-primary">View My Orders</a>
    <a href="{{ url_for('index') }}" class="btn btn-outline">Continue Shopping</a>
  </div>
</div>
{% endblock %}
