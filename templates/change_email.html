{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Change Email</h2>
  <p style="text-align:center; font-size:12px; color:#888; margin-top:-10px; margin-bottom:16px;">Current email: {{ current_user['email'] }}</p>
  <form method="post">
    <div class="form-group">
      <label>New Email</label>
      <input type="email" name="new_email" required>
    </div>
    <div class="form-group">
      <label>Current Password (to confirm it's you)</label>
      <div class="password-wrap">
        <input type="password" name="current_password" id="confirmPw" required>
        <span class="toggle-password" data-target="confirmPw">👁️</span>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update Email</button>
  </form>
  <p style="text-align:center; margin-top:14px; font-size:13px;"><a href="{{ url_for('account') }}" style="color:var(--maroon); font-weight:600;">← Back to Account</a></p>
</div>
{% endblock %}
