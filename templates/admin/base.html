{% extends "base.html" %}
{% block content %}
<div class="admin-layout">
  <div class="admin-sidebar">
    <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint=='admin_dashboard' }}">📊 Dashboard</a>
    <a href="{{ url_for('admin_analytics') }}" class="{{ 'active' if request.endpoint=='admin_analytics' }}">📈 Analytics</a>
    <a href="{{ url_for('admin_products') }}" class="{{ 'active' if 'admin_product' in request.endpoint }}">👗 Products</a>
    <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if request.endpoint=='admin_orders' }}">📦 Orders</a>
    <a href="{{ url_for('admin_coupons') }}" class="{{ 'active' if 'admin_coupon' in request.endpoint }}">🎟️ Coupons</a>
    <a href="{{ url_for('admin_returns') }}" class="{{ 'active' if request.endpoint=='admin_returns' }}">↩️ Returns</a>
    <a href="{{ url_for('admin_messages') }}" class="{{ 'active' if request.endpoint=='admin_messages' }}">✉️ Messages</a>
    <a href="{{ url_for('index') }}">🏠 View Store</a>
  </div>
  <div class="admin-main">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
