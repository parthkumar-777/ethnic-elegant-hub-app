{% extends "admin/base.html" %}
{% block admin_content %}
<h2 style="border:none; color:var(--maroon);">Contact Messages ({{ messages|length }})</h2>
{% if messages %}
  {% for m in messages %}
  <div class="cart-summary" style="margin-bottom:14px;">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
      <div>
        <b>{{ m['name'] }}</b> · <span style="color:#888; font-size:12px;">{{ m['email'] }}</span><br>
        <span style="font-size:12px; color:#888;">{{ m['created_at']|fmtdate }}</span>
      </div>
    </div>
    <p style="font-size:13px; margin-top:8px;">{{ m['message'] }}</p>
  </div>
  {% endfor %}
{% else %}
<p style="color:#888;">No messages yet.</p>
{% endif %}
{% endblock %}
