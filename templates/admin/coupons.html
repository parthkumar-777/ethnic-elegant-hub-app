{% extends "admin/base.html" %}
{% block admin_content %}
<h2 style="border:none; color:var(--maroon);">Coupons</h2>

<form method="post" action="{{ url_for('admin_coupon_new') }}" style="max-width:520px; background:#fff; padding:20px; border-radius:8px; border:1px solid #eee; margin-bottom:24px;">
  <div style="display:flex; gap:12px;">
    <div class="form-group" style="flex:1;">
      <label>Coupon Code</label>
      <input type="text" name="code" placeholder="FESTIVE20" required style="text-transform:uppercase;">
    </div>
    <div class="form-group" style="flex:1;">
      <label>Discount %</label>
      <input type="number" step="0.01" name="discount_percent" placeholder="20" required>
    </div>
  </div>
  <div class="form-group">
    <label>Minimum Order Amount (₹, optional)</label>
    <input type="number" step="0.01" name="min_order_amount" placeholder="0">
  </div>
  <button type="submit" class="btn btn-gold">+ Add Coupon</button>
</form>

<table>
  <tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Status</th><th>Actions</th></tr>
  {% for c in coupons %}
  <tr>
    <td><b>{{ c['code'] }}</b></td>
    <td>{{ c['discount_percent']|int }}%</td>
    <td>₹{{ c['min_order_amount']|int }}</td>
    <td>
      <span class="badge {{ 'badge-delivered' if c['active'] else 'badge-cancelled' }}">{{ 'Active' if c['active'] else 'Inactive' }}</span>
    </td>
    <td>
      <form method="post" action="{{ url_for('admin_coupon_toggle', cid=c['id']) }}" style="display:inline;">
        <button type="submit" class="btn btn-outline btn-sm">{{ 'Deactivate' if c['active'] else 'Activate' }}</button>
      </form>
      <form method="post" action="{{ url_for('admin_coupon_delete', cid=c['id']) }}" style="display:inline;" onsubmit="return confirm('Delete this coupon?');">
        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
