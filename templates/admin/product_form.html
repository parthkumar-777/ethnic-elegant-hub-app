{% extends "admin/base.html" %}
{% block admin_content %}
<h2 style="border:none; color:var(--maroon);">{{ 'Edit Product' if p else 'Add New Product' }}</h2>
<form method="post" enctype="multipart/form-data" style="max-width:560px; background:#fff; padding:24px; border-radius:8px; border:1px solid #eee;">
  <div class="form-group">
    <label>Product Name</label>
    <input type="text" name="name" required value="{{ p['name'] if p else '' }}">
  </div>
  <div class="form-group">
    <label>Description</label>
    <textarea name="description" rows="3">{{ p['description'] if p else '' }}</textarea>
  </div>
  <div class="form-group">
    <label>Category</label>
    <select name="category" required>
      {% for c in categories %}
      <option value="{{ c }}" {% if p and p['category']==c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
  </div>
  <div style="display:flex; gap:12px;">
    <div class="form-group" style="flex:1;">
      <label>Selling Price (₹)</label>
      <input type="number" step="0.01" name="price" required value="{{ p['price'] if p else '' }}">
    </div>
    <div class="form-group" style="flex:1;">
      <label>MRP (₹)</label>
      <input type="number" step="0.01" name="mrp" required value="{{ p['mrp'] if p else '' }}">
    </div>
  </div>
  <div style="display:flex; gap:12px;">
    <div class="form-group" style="flex:1;">
      <label>Color</label>
      <input type="text" name="color" value="{{ p['color'] if p else '' }}">
    </div>
    <div class="form-group" style="flex:1;">
      <label>Fabric</label>
      <input type="text" name="fabric" value="{{ p['fabric'] if p else '' }}">
    </div>
  </div>
  <div style="display:flex; gap:12px;">
    <div class="form-group" style="flex:1;">
      <label>Stock Quantity</label>
      <input type="number" name="stock" value="{{ p['stock'] if p else 100 }}">
    </div>
    <div class="form-group" style="flex:1;">
      <label>Sizes (comma separated)</label>
      <input type="text" name="sizes" value="{{ p['sizes'] if p else 'S,M,L,XL' }}">
    </div>
  </div>
  <div class="form-group">
    <label>Product Image (upload to replace)</label>
    <input type="file" name="image_file" accept="image/*">
    <input type="hidden" name="existing_image" value="{{ p['image'] if p else '' }}">
    {% if p %}<img src="{{ img_url(p['image'], 'products') }}" style="width:80px; margin-top:8px; border-radius:6px;">{% endif %}
  </div>
  <div class="form-group">
    <label><input type="checkbox" name="is_featured" style="width:auto;" {% if p and p['is_featured'] %}checked{% endif %}> Show in Featured Collection</label>
  </div>
  <button type="submit" class="btn btn-primary">{{ 'Save Changes' if p else 'Add Product' }}</button>
  <a href="{{ url_for('admin_products') }}" class="btn btn-outline">Cancel</a>
</form>
{% endblock %}
